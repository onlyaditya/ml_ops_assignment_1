[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
# Silence deprecation noise raised *inside* third-party libraries only;
# warnings from our own src/ code still show up.
filterwarnings =
    ignore::DeprecationWarning:matplotlib.*
    ignore::DeprecationWarning:mlflow.*
    ignore::DeprecationWarning:pydantic.*
