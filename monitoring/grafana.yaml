apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472          # grafana user in the official image
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: user}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: password}
            # read-only anonymous access, so the dashboard opens without logging in
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/heart-api.json
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /etc/grafana/dashboards}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: LoadBalancer        # http://localhost:3030 (3000 is often taken by dev servers)
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3030
      targetPort: http
