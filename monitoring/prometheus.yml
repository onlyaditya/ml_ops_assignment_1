# Prometheus configuration (mounted from a ConfigMap generated by kustomization.yaml)
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Discover every API pod individually (not via the Service), so per-pod
  # metrics stay separate and a broken pod is visible as up == 0.
  - job_name: heart-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [heart-disease]
    relabel_configs:
      # only pods that opt in with prometheus.io/scrape: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
