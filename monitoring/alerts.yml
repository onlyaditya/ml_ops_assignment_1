# Alert rules, visible under Alerts in the Prometheus UI (no Alertmanager is
# deployed, so they are shown but not sent anywhere).
groups:
  - name: heart-api
    rules:
      - alert: HeartApiPodDown
        expr: up{job="heart-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "API pod {{ $labels.pod }} is not answering /metrics"

      - alert: HeartApiServerErrors
        expr: |
          sum(rate(heart_api_requests_total{status=~"5.."}[5m]))
            / sum(rate(heart_api_requests_total[5m])) > 0.01
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "More than 1% of requests fail with a server error"

      - alert: HeartApiSlowPredictions
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(heart_api_request_duration_seconds_bucket{endpoint="/predict"}[5m])))
            > 0.25
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 /predict latency above 250 ms"

      - alert: HeartApiManyRejectedInputs
        expr: |
          sum(rate(heart_api_requests_total{endpoint="/predict", status="422"}[10m]))
            / sum(rate(heart_api_requests_total{endpoint="/predict"}[10m])) > 0.2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Over 20% of /predict calls are rejected - a client may be sending a bad schema"

      # 46% of the training patients had heart disease. A mean predicted
      # probability far from that for a long time suggests the incoming
      # population (or the data pipeline feeding the API) has changed.
      - alert: HeartApiPredictionDrift
        expr: |
          (sum(rate(heart_api_prediction_probability_sum[1h]))
            / sum(rate(heart_api_prediction_probability_count[1h]))) > 0.75
          or
          (sum(rate(heart_api_prediction_probability_sum[1h]))
            / sum(rate(heart_api_prediction_probability_count[1h]))) < 0.2
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Mean predicted P(disease) {{ $value | humanizePercentage }} is far from the 46% training base rate"
